apiVersion: harness.planeon.ai/questionnaire/v1alpha1
kind: Questionnaire
id: banking.governance.waivers
stage: governance-and-regulation
title: Banking waiver declaration
questions:
  - id: waiver-control-id
    prompt: Provide the exact control objective identifier for the documented exception.
    responseType: string
    required: false
  - id: waiver-scope-id
    prompt: Provide the exact case scope identifier for the documented exception.
    responseType: string
    required: false
  - id: waiver-approval-reference-id
    prompt: Provide the stable WAIVER ApprovalRequest identifier.
    responseType: string
    required: false
  - id: waiver-justification-evidence-refs
    prompt: Provide stable local identifiers for exception justification evidence.
    responseType: string
    required: false
  - id: waiver-compensating-control-id
    prompt: Provide the stable compensating control objective identifier.
    responseType: string
    required: false
  - id: waiver-expiry-time
    prompt: State the non-renewable waiver expiry as an explicit UTC timestamp.
    responseType: string
    required: false
  - id: waiver-does-not-satisfy-promotion-confirmed
    prompt: Confirm that a waiver documents an exception and never satisfies production promotion.
    responseType: boolean
    required: true
