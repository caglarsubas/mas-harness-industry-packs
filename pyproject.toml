[build-system]
requires = []
build-backend = "planeon_industry_packs.build_backend"
backend-path = ["src"]

[project]
name = "planeon-harness-industry-packs"
version = "0.1.0"
description = "Offline deterministic industry guidance pack framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "jsonschema==4.24.0",
  "PyYAML==6.0.2",
]

[project.scripts]
harness-pack = "planeon_industry_packs.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests/framework"]
